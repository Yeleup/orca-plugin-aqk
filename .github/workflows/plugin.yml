# The plugin on macOS, Windows and Linux (Ф14 of docs/mvp/tz.md). On each system: Orca's CLI of exactly the minimum
# version of engines.orca in orca-plugin.json, from that Orca release's package for the system, its CLI under Electron in
# Node mode (scripts/ci.mjs install-orca); the preparation of a worktree as Orca runs `setup` of orca.yaml (on Windows
# through a .cmd file, scripts/ci.mjs hook); `plugin validate`, the type check and `plugin test` on that CLI;
# `plugin inspect` of a clean export of the commit (git archive: no node_modules, no .orca); `archive` of orca.yaml as
# Orca runs it. tests/ci.test.mjs checks this file and runs its steps with fakes.
#
# Every `run` is a bash script (defaults.run.shell): Git Bash on Windows. Actions in the repository are the owner's to
# enable (docs/mvp/tz.md, «Только владелец»).
name: Плагин на трёх системах

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Плагин — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Коммит
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The delivery tests run `make test`, whose recorder needs bash 4.4 or newer: macOS ships bash 3.2.
      - name: bash 4.4 или новее для make test (macOS)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # The delivery tests run `make test`: the Windows runner has no GNU make.
      - name: GNU make для make test (Windows)
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress

      - name: CLI Orca ровно минимальной версии из engines.orca манифеста
        run: node scripts/ci.mjs install-orca "$RUNNER_TEMP/orca"

      - name: setup из orca.yaml так, как его запускает Orca (на Windows — через .cmd)
        run: node scripts/ci.mjs hook setup

      - name: plugin validate
        run: '"$ORCA_CLI_COMMAND" plugin validate .'

      - name: Проверка типов (plugin types и TypeScript по пути пакета)
        run: |
          "$ORCA_CLI_COMMAND" plugin types .
          node node_modules/typescript/bin/tsc -p .
          echo "tsc: типы в порядке"

      - name: plugin test
        run: '"$ORCA_CLI_COMMAND" plugin test .'

      - name: plugin inspect чистой выгрузки коммита (git archive, без node_modules и .orca)
        run: |
          export_dir="$RUNNER_TEMP/plugin-export"
          rm -rf "$export_dir"
          mkdir -p "$export_dir"
          git archive --format=tar HEAD | tar -x -f - -C "$export_dir"
          test ! -e "$export_dir/node_modules"
          test ! -e "$export_dir/.orca"
          "$ORCA_CLI_COMMAND" plugin inspect "$export_dir"

      - name: archive из orca.yaml так, как его запускает Orca (на Windows — через .cmd)
        run: node scripts/ci.mjs hook archive
